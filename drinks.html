</svg>

        <section class="menu-section">

            <div class="dish">

            </div>

            <div class="dish">
                <img class="dish-img" src="images/seven_up.jpeg" alt="7UP">

                    <h3 class="dish-name">7UP</h3>
                    <span class="dish-price">$1.00</span>
                </div>

            </div>

            <div class="dish">
                <img class="dish-img" src="images/pepsi_drink.jpeg" alt="Pepsi">

            <div class="dish">
                <img class="dish-img" src="images/mirinda.jpeg" alt="Mirinda">

                    <h3 class="dish-name">Mirinda</h3>
                    <span class="dish-price">$1.00</span>
